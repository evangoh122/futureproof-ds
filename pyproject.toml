[project]
name = "trail-conversion-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scikit-learn==1.5.2",
    "xgboost==2.1.1",
    "matplotlib==3.8.4",
    "SQLAlchemy==2.0.32",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "joblib>=1.4,<2",
    "jupyter==1.1.1",
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
trial-conversion = "trial_conversion.pipeline:main"
